name: Build WatchTower for Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'agent/**'
      - 'desktop/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - '.github/workflows/build-windows.yml'
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "WatchTower version $v"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript validation
        run: npm run typecheck

      - name: Build application (Next.js standalone)
        run: npm run build

      - name: Normalize standalone output (materialize links)
        run: npm run desktop:clean

      - name: Package Windows executables (installer + portable)
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Verify expected executables exist and are not empty
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          foreach ($f in @("release/WatchTower-Setup-$v.exe", "release/WatchTower-Portable-$v-x64.exe")) {
            if (-not (Test-Path $f)) { throw "Missing expected executable: $f" }
            $size = (Get-Item $f).Length
            if ($size -lt 50MB) { throw "$f is suspiciously small ($size bytes)" }
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash
            Write-Host ("{0}  {1:N1} MB  SHA256 {2}" -f $f, ($size/1MB), $hash)
          }

      - name: Package resource and server runtime tests
        env:
          WATCHTOWER_REQUIRE_PACKAGE: '1'
        run: npm test

      - name: Launch packaged app end-to-end (isolated data directory)
        run: node scripts/verify-packaged.cjs release/win-unpacked/WatchTower.exe

      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: WatchTower-Windows-x64-v${{ steps.version.outputs.version }}
          path: |
            release/WatchTower-Setup-${{ steps.version.outputs.version }}.exe
            release/WatchTower-Portable-${{ steps.version.outputs.version }}-x64.exe
          if-no-files-found: error
          retention-days: 30
